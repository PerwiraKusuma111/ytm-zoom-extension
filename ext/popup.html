<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Mobile Zoom</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; width: 300px; background: #0f0f0f; color: #fff; }
    .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .ttl { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 14px; font-weight: 800; color: #ff2d55; flex: none; }
    .box { background: #1c1c1c; border-radius: 12px; padding: 11px; margin-bottom: 10px; }
    input[type=range] { width: 100%; accent-color: #ff2d55; margin: 4px 0 10px; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pbtn { background: #2c2c2c; color: #fff; border: 0; border-radius: 8px; padding: 7px 0; font-size: 12px; font-weight: 600; cursor: pointer; }
    .pbtn.act { background: #ff2d55; color: #fff; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; }
    .row + .row { border-top: 1px solid #2b2b2b; margin-top: 8px; padding-top: 10px; }
    .lbl { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.3; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: #ff2d55; flex: none; }
    .acts { display: flex; gap: 8px; }
    .apply { flex: 1; background: #ff2d55; color: #fff; border: 0; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .reset { background: #2a2a2a; color: #ddd; border: 0; border-radius: 10px; padding: 10px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .st { text-align: center; font-size: 11px; color: #8be28b; min-height: 15px; margin-top: 6px; }
    .list-hd { font-size: 11px; color: #999; margin: 8px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .sitem { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 0; border-top: 1px solid #262626; font-size: 12px; }
    .sitem:first-child { border-top: 0; padding-top: 0; }
    .shost { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smeta { color: #ff6b86; font-weight: 700; flex: none; }
    .sdel { background: #333; color: #fff; border: 0; border-radius: 6px; padding: 2px 7px; font-size: 11px; cursor: pointer; flex: none; }
    .dis { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="hd">
    <div class="ttl" id="hostLbl">Memuat situs...</div>
    <div class="badge" id="zval">100%</div>
  </div>
  <div id="controls">
    <div class="box">
      <input id="rng" type="range" min="50" max="300" step="10" value="100">
      <div class="presets">
        <button class="pbtn" data-z="100">100%</button>
        <button class="pbtn" data-z="180">180%</button>
        <button class="pbtn" data-z="220">220%</button>
        <button class="pbtn" data-z="250">250%</button>
      </div>
    </div>
    <div class="box">
      <label class="row">
        <div>
          <div class="lbl">Kunci Anti Zoom</div>
          <div class="sub">Matikan cubit zoom &amp; klik 2x di situs ini</div>
        </div>
        <input id="noZoom" type="checkbox">
      </label>
      <label class="row">
        <div>
          <div class="lbl">Mode Desktop UA</div>
          <div class="sub">Kirim User-Agent Desktop khusus situs ini</div>
        </div>
        <input id="deskUA" type="checkbox">
      </label>
    </div>
    <div class="acts">
      <button class="apply" id="btnApply">Terapkan &amp; Reload</button>
      <button class="reset" id="btnReset">Reset</button>
    </div>
  </div>
  <div class="st" id="st"></div>
  <div id="savedWrap" style="display:none">
    <div class="list-hd">Situs Tersimpan</div>
    <div class="box" id="savedList"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
