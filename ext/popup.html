<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YTM Mobile Zoom</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; width: 290px; background: #0f0f0f; color: #fff; }
    .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .ttl { font-size: 15px; font-weight: 700; }
    .badge { font-size: 13px; font-weight: 700; color: #ff2d55; }
    .box { background: #1c1c1c; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    input[type=range] { width: 100%; accent-color: #ff2d55; margin: 6px 0 10px; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pbtn { background: #2c2c2c; color: #fff; border: 0; border-radius: 8px; padding: 7px 0; font-size: 12px; font-weight: 600; cursor: pointer; }
    .pbtn.act { background: #ff2d55; color: #fff; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
    .row + .row { border-top: 1px solid #2b2b2b; margin-top: 8px; padding-top: 10px; }
    .lbl { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.3; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: #ff2d55; flex: none; }
    .apply { width: 100%; background: #ff2d55; color: #fff; border: 0; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .apply:active { opacity: 0.85; }
    .st { text-align: center; font-size: 11px; color: #8be28b; min-height: 15px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="hd">
    <div class="ttl">YTM Mobile Zoom</div>
    <div class="badge" id="zval">250%</div>
  </div>
  <div class="box">
    <input id="rng" type="range" min="100" max="300" step="10" value="250">
    <div class="presets">
      <button class="pbtn" data-z="100">100%</button>
      <button class="pbtn" data-z="180">180%</button>
      <button class="pbtn" data-z="220">220%</button>
      <button class="pbtn" data-z="250">250%</button>
    </div>
  </div>
  <div class="box">
    <label class="row">
      <div>
        <div class="lbl">Kunci Anti Zoom</div>
        <div class="sub">Matikan cubit zoom &amp; klik 2x</div>
      </div>
      <input id="noZoom" type="checkbox" checked>
    </label>
    <label class="row">
      <div>
        <div class="lbl">Mode Desktop UA (Alternatif)</div>
        <div class="sub">Pakai ini jika ingin Situs Desktop OFF &amp; Zoom 100%</div>
      </div>
      <input id="deskUA" type="checkbox">
    </label>
  </div>
  <button class="apply" id="btnApply">Terapkan &amp; Reload YT Music</button>
  <div class="st" id="st"></div>
  <script src="popup.js"></script>
</body>
</html>
